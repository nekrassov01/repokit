name: CI
on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
    tags-ignore:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    timeout-minutes: 30
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          args: --timeout=10m
          skip-cache: true

      - name: Run vulnerability check
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          cache: false

      - name: Run tests
        run: |
          go test -race -cover -v -coverprofile coverage.out -covermode atomic ./...

      - name: Run octocov
        uses: k1LoW/octocov-action@v1.5.2
